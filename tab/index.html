<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" href="./src/img/icon/snow.png" />
    <title>INIT</title>
    <link rel="stylesheet" href="./src/css/home.css" />
    <link
      rel="stylesheet"
      href="https://at.alicdn.com/t/c/font_2691375_rhuyt90isv.css"
    />
  </head>

<body style="height: 100vh">
  <!-- -------------------------内容区域 -------------------------------->
  <div class="content-area">
    <!-- 顶栏 -->
    <header class="shell-topbar">
      <div class="shell-topbar-left">
        <span class="shell-logo" id="shell-logo" title="INIT">❄</span>
        <span class="shell-brand-title">INIT</span>
      </div>
      <div class="shell-topbar-right">
        <div class="shell-topbar-slot shell-zone-topbar" data-widget-zone="topbar"></div>
        <!-- 主题切换器（由左侧竖条迁入，保留全部 class/id 钩子） -->
        <div class="ipage-aside-theme" title="切换主题">
          <span class="icon-theme"></span>
          <div class="theme-switcher dropdown" id="theme-switcher">
            <div class="dropdown-item theme-option" data-theme="slate-light">
              <span class="dropdown-item-icon">◐</span>
              <span>石墨浅调</span>
            </div>
            <div class="dropdown-item theme-option" data-theme="midnight-ink">
              <span class="dropdown-item-icon">🌑</span>
              <span>深夜墨色</span>
            </div>
            <div class="dropdown-item theme-option" data-theme="coral-amber">
              <span class="dropdown-item-icon">🪸</span>
              <span>珊瑚金橙</span>
            </div>
            <div class="dropdown-item theme-option" data-theme="indigo-mint">
              <span class="dropdown-item-icon">💎</span>
              <span>靛蓝薄荷</span>
            </div>
            <div class="dropdown-item theme-option" data-theme="violet-amber">
              <span class="dropdown-item-icon">🔮</span>
              <span>紫罗兰柠黄</span>
            </div>
            <div class="dropdown-item theme-option" data-theme="rose-sky">
              <span class="dropdown-item-icon">🌸</span>
              <span>玫红天蓝</span>
            </div>
          </div>
        </div>
        <!-- 设置入口（保留 class 钩子） -->
        <div class="ipage-aside-setting" id="shell-setting-btn" title="设置">
          <span class="icon-setting"></span>
        </div>
      </div>
    </header>
    <!-- Hero 搜索区 -->
    <main class="shell-hero">
      <div id="user_search_area">
        <div id="user_input_area">
          <button id="btn-retrieval-engine" title="切换搜索引擎">
            <span class="icon-baidu"></span>
          </button>
          <input type="text" spellcheck="false" id="user-content" placeholder="搜索网页或输入关键词，按 Enter 直达…" autocomplete="off" />
          <button id="btn-retrieval-content" title="搜索">
            <span class="icon-search"></span>
          </button>
        </div>
        <div class="suggestion-list" id="suggestion-list"></div>
      </div>
      <div class="shell-zone-hero" data-widget-zone="hero"></div>
    </main>
    <!-- 工作区（三列 grid） -->
    <section class="shell-workbench">
      <div class="shell-widgets-left" data-widget-zone="left"></div>
      <div class="shell-workbench-center">
        <div id="ipage-tabs">
          <div class="workbench-header-meta">
            <span class="workbench-header-title">我的导航与收藏</span>
            <span class="workbench-header-subtitle">拖拽可自由排序或从右侧标签页拖入</span>
          </div>
          <button class="tab-btn-add-collection">
            <span class="icon-plus add-collection-icon"></span><span class="add-collection-text">新建分组</span>
          </button>
        </div>
        <div id="ipage-collections"></div>
      </div>
      <div class="ipage-body-right">
        <div class="ipage-aside-header">
          <span class="ipage-aside-title">窗口与历史</span>
          <button class="btn-aside-fold" title="折叠/展开侧栏">
            <span class="icon-fold ipage-aside-fold"></span>
          </button>
        </div>
        <div class="ipage-sections">
          <div class="section">
            <div class="section-title-row">
              <div class="section-title">活跃标签页</div>
              <span class="section-badge">拖拽可收藏</span>
            </div>
            <ul class="section-tabs-show"></ul>
          </div>
          <div class="section">
            <div class="section-title-row">
              <div class="section-title">最近历史</div>
              <button class="section-history-clear-all" type="button">清空</button>
            </div>
            <div class="section-history-viewport">
              <ul class="section-history-show"></ul>
            </div>
            <div class="section-history-pagination">
              <button class="history-page-btn history-page-prev" type="button">上一页</button>
              <span class="history-page-info">1 / 1</span>
              <button class="history-page-btn history-page-next" type="button">下一页</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <!-- 引入第三方库 -->
  <script src="../vender/sortablejs.js"></script>
  <!-- 自定义的一些方法 -->
  <script src="./src/js/components/input-file.js"></script>
  <script src="./src/js/theme-switcher.js"></script>
  <script src="./src/js/settings-manager.js"></script>
  <script src="../utils/color.js"></script>
  <script src="../utils/index.js"></script>
  <script src="../utils/form.js"></script>
  <script src="../utils/dropdown.js"></script>
  <script src="../utils/notification.js"></script>
  <!-- store -->
  <script src="./src/js/store/index.js"></script>
  <!-- 声明标签获取函数 -->
  <script src="../utils/declare_element.js"></script>
  <!-- indexedDB -->
  <script src="./src/js/indexeddb/models/index.model.js"></script>
  <script src="./src/js/indexeddb/utils/index.utils.js"></script>
  <script src="./src/js/indexeddb/index.js"></script>
  <!-- 元素获取 -->
  <script src="./src/js/fun_module/declare/search.js"></script>
  <script src="./src/js/fun_module/declare/collections.js"></script>
  <script src="./src/js/fun_module/declare/tools.js"></script>
  <script src="./src/js/fun_module/declare/section.js"></script>
  <script src="./src/js/fun_module/declare/aside.js"></script>
  <!-- 模块的一些操作 -->
  <script src="./src/js/fun_module/execute/search.js"></script>
  <script src="./src/js/fun_module/execute/collection.js"></script>
  <script src="./src/js/fun_module/execute/tool.js"></script>
  <script src="./src/js/fun_module/execute/section.js"></script>
  <script src="./src/js/fun_module/execute/aside.js"></script>
  <!-- api -->
  <script src="./src/js/apis/index.js"></script>
  <!-- load -->
  <script src="./src/js/load.js"></script>
  <!-- wallpaper engine -->
  <script src="./src/js/wallpaper-manager.js"></script>
  <!-- widgets registry -->
  <script src="./src/js/widgets/registry.js"></script>
  <!-- widgets store（$widgetStore 边界，tools widget 依赖） -->
  <script src="./src/js/widgets/store.js"></script>
  <!-- widgets -->
  <script src="./src/js/widgets/clock.js"></script>
  <script src="./src/js/widgets/todo.js"></script>
  <script src="./src/js/widgets/quote.js"></script>
  <script src="./src/js/widgets/tools.js"></script>
  <script src="./src/js/widgets/engines.js"></script>
</body>

</html>
